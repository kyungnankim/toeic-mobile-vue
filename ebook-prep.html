<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#312e81" />
  <meta name="description" content="영어 원서 읽기 전 학습" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/ebook.css?v=3" />
  <title>읽기 전 학습 | TOEIC EBOOK</title>
</head>
<body data-ebook-view="prep">
  <div class="ebook-shell">
    <header class="ebook-topbar">
      <a href="/" class="back-btn" aria-label="홈으로"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div class="top-title"><strong>TOEIC EBOOK</strong><span>영어 원서 학습</span></div>
      <button id="topAudioStop" class="top-action" type="button" hidden>정지</button>
    </header>

    <main class="book-view">
      <section class="book-head">
        <div class="mini-cover"><span>THE GREAT</span><b>GATSBY</b><small>F. SCOTT FITZGERALD</small></div>
        <div class="book-info">
          <h1 id="bookTitle">The Great Gatsby</h1>
          <p id="bookAuthor">F. Scott Fitzgerald</p>
          <div class="book-meta"><span id="bookLevel">중상급</span><span id="bookChapters">9 Chapters</span></div>
        </div>
      </section>

      <nav class="book-tabs" aria-label="책 메뉴">
        <button id="prepTab" class="active" type="button" aria-current="page">읽기 전 학습</button>
        <button id="readTab" type="button">책 읽기</button>
      </nav>

      <section id="prepPanel" class="prep-panel" aria-label="읽기 전 학습">
        <section class="chapter-control card compact-card">
          <div class="control-head"><strong>읽기 전 학습</strong><span id="prepChapterProgress">0%</span></div>
          <div class="chapter-row">
            <button id="prepPrevChapter" class="square-btn" type="button" aria-label="이전 챕터"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <label class="chapter-select-wrap"><span>CHAPTER</span><select id="prepChapterSelect"></select></label>
            <button id="prepNextChapter" class="square-btn" type="button" aria-label="다음 챕터"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </section>

        <section class="study-section card">
          <div class="study-title"><h2>단어</h2><span id="vocabCount"></span></div>
          <div id="vocabList" class="vocab-list"></div>
        </section>

        <section class="study-section card">
          <div class="study-title"><h2>문법</h2><span id="grammarCount"></span></div>
          <div id="grammarList" class="grammar-list"></div>
        </section>

        <button id="finishPrepBtn" class="finish-prep" type="button">이 챕터 읽기</button>
      </section>
    </main>
  </div>

  <script src="/ebook-common.js?v=1"></script>
  <script src="/ebook-prep.js?v=1"></script>
</body>
</html>
