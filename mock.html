<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="TOEIC RC 문제를 웹에서 직접 풀고 자동 채점하는 모바일 연습 사이트" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./icons.css" />
  <link rel="stylesheet" href="./mock-test.css" />
  <link rel="stylesheet" href="./rc.css" />
  <link rel="stylesheet" href="./theme-indigo.css" />
  <title>TOEIC RC Practice</title>
</head>
<body>
  <div class="app-shell mock-app-shell">
    <header class="topbar">
      <a class="brand mock-back-brand" href="./index.html" aria-label="단어 학습 홈으로">
        <span class="brand-mark">T</span>
        <span><b>TOEIC RC</b><small>문제 직접 풀기</small></span>
      </a>
      <a class="mock-home-link" href="./index.html">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        단어 학습
      </a>
    </header>

    <main class="view rc-view">
      <section class="rc-hero">
        <div>
          <p class="eyebrow">RC PRACTICE</p>
          <h1>문제를<br>바로 풀어요</h1>
          <p>문제·보기·지문을 사이트 데이터에 넣었습니다. PDF 업로드 없이 바로 풀고 자동 채점할 수 있습니다.</p>
        </div>
        <div class="rc-time-box">
          <span>남은 시간</span>
          <strong id="timeValue">30:00</strong>
          <button id="timerBtn">시작</button>
        </div>
      </section>

      <div class="rc-set-tabs">
        <button class="rc-set-tab active" data-set="v1"><b>RC 연습 1</b><span>25문항 · Part 5–7</span></button>
        <button class="rc-set-tab" data-set="v2"><b>RC 연습 2</b><span>25문항 · Part 5–7</span></button>
      </div>

      <section class="rc-status-card">
        <div>
          <span id="setTitle">JKCB TOEIC RC Practice 1</span>
          <strong><span id="answeredCount">0</span> / <span id="totalCount">25</span></strong>
        </div>
        <div class="mock-progress-track"><i id="progressFill" style="width:0%"></i></div>
        <div class="rc-status-actions">
          <div id="partTabs" class="rc-part-tabs"></div>
          <button id="nextBlankBtn">다음 미답</button>
        </div>
      </section>

      <section id="resultBox" class="rc-result-card" hidden>
        <div>
          <p class="eyebrow">RESULT</p>
          <strong><span id="scoreValue">0</span> / 25</strong>
          <span id="scorePercent">0%</span>
        </div>
        <div class="rc-result-grid">
          <span><b id="part5Score">0/15</b>Part 5</span>
          <span><b id="part6Score">0/4</b>Part 6</span>
          <span><b id="part7Score">0/6</b>Part 7</span>
        </div>
      </section>

      <section id="questionArea" class="rc-question-area" aria-live="polite"></section>

      <div class="rc-bottom-actions">
        <button id="resetBtn">답안 초기화</button>
        <button id="scoreBtn" class="primary">채점하기</button>
      </div>
    </main>
  </div>
  <script src="./rc.js"></script>
</body>
</html>
